services:
  - type: web
    name: trace-x
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:////app/backend/trace_x.db
      - key: STORAGE_DIR
        value: /app/backend/storage/evidence
