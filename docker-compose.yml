version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trace-x-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/trace_x.db
      - STORAGE_DIR=/app/storage/evidence
      - MAX_UPLOAD_SIZE_BYTES=52428800
      - ENVIRONMENT=production
    volumes:
      - backend-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trace-x-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-storage:
